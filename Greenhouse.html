<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greenhouse PT Suryo Riset Indonesia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
*{box-sizing:border-box}
:root{--ink:#10261c;--forest:#0b3b2a;--emerald:#17734d;--leaf:#43a86b;--mint:#e6f3ea;--sage:#f0f5f1;--card:#fff;--line:#dbe7de;--muted:#5f7568;
--head:"Montserrat","Segoe UI",Arial,sans-serif;--body:"Source Sans 3","Segoe UI",Arial,sans-serif}
body{margin:0;font-family:var(--body);background:var(--sage);color:var(--ink);font-size:15px}
button{font-family:inherit}
:focus-visible{outline:3px solid #7fd1a0;outline-offset:2px}

/* Header */
.header{background:linear-gradient(120deg,#082e21 0%,#0f5a3d 60%,#1f8a58 100%);color:#fff;padding:28px 5% 26px}
.header-content{max-width:1250px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:18px}
.brand-logo{width:88px;height:88px;border-radius:16px;background:rgba(255,255,255,.12);border:1.5px dashed rgba(255,255,255,.4);display:grid;place-items:center;overflow:hidden;flex:none;font-family:var(--head);font-size:11px;font-weight:600;color:rgba(255,255,255,.75)}
.brand-logo.has-img{border:0;background:none;border-radius:0;overflow:visible}
.brand-logo img{width:100%;height:100%;object-fit:contain;display:block}
.title h1{margin:0 0 6px;font-family:var(--head);font-weight:800;font-size:clamp(22px,3.6vw,36px);letter-spacing:-.5px;line-height:1.15}
.title p{margin:0;font-family:var(--head);font-weight:500;font-size:clamp(13px,1.6vw,16px);color:rgba(255,255,255,.82);letter-spacing:.2px}
.connection{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.14);padding:10px 18px;border-radius:999px;white-space:nowrap;font-family:var(--head);font-size:14px;font-weight:700;border:1px solid rgba(255,255,255,.2)}
.dot{width:10px;height:10px;border-radius:50%;background:#ffb020;box-shadow:0 0 0 4px rgba(255,176,32,.18)}
.dot.online{background:#4ee08f;box-shadow:0 0 0 4px rgba(78,224,143,.2)}
.dot.offline{background:#ef6a5e;box-shadow:0 0 0 4px rgba(239,106,94,.2)}

/* Sidebar (muncul saat kursor di tepi kiri) */
.edge{position:fixed;left:0;top:0;bottom:0;width:16px;z-index:29}
.handle{position:fixed;left:0;top:50%;transform:translateY(-50%);width:22px;height:70px;border:0;border-radius:0 10px 10px 0;background:var(--emerald);color:#fff;font-size:16px;cursor:pointer;z-index:28;opacity:.9;box-shadow:2px 0 10px rgba(0,0,0,.15)}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:linear-gradient(180deg,#082e21 0%,#0f5a3d 100%);color:#fff;transform:translateX(-102%);transition:transform .25s ease;z-index:30;padding:26px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:6px 0 28px rgba(0,0,0,.28)}
.edge:hover+.sidebar,.sidebar:hover,.sidebar:focus-within,.sidebar.open{transform:none}
.side-title{font-family:var(--head);font-weight:700;font-size:13px;color:rgba(255,255,255,.65);padding:0 12px 8px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.15)}
.tab{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:13px 12px;border-radius:11px;font-family:var(--head);font-size:14px;font-weight:600;color:rgba(255,255,255,.82);cursor:pointer;text-align:left;transition:background .15s,color .15s}
.tab .ti{font-size:20px;width:28px;text-align:center}
.tab:hover{background:rgba(255,255,255,.1);color:#fff}
.tab[aria-selected="true"]{background:#fff;color:var(--forest)}
.range{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap;margin:22px 0 0}
.range span{font-size:13px;color:var(--muted);margin-right:3px;font-weight:600}
.chip{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:#40574a;transition:.15s}
.chip:hover{border-color:var(--leaf);background:var(--mint)}
.chip.active{background:var(--forest);border-color:var(--forest);color:#fff}

/* Layout */
.container{max-width:1250px;margin:0 auto;padding:6px 18px 10px}
.panel[hidden],.range[hidden]{display:none}
#panel-profil{margin-top:22px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:18px 0 14px}
.section-title{margin:0;font-family:var(--head);font-weight:700;font-size:20px;letter-spacing:-.2px;color:var(--forest)}
.section-sub{font-size:13px;color:var(--muted);margin-top:3px}
.subgroup{font-family:var(--head);font-weight:600;font-size:14px;color:var(--emerald);margin:20px 0 10px}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:15px}
.card,.chart-card,.download-panel{background:var(--card);border-radius:14px;border:1px solid var(--line)}
.card{padding:18px 19px 16px;border-left:5px solid var(--cc,var(--leaf))}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.label{color:var(--muted);font-size:14px;font-weight:600}
.icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--mint);font-size:22px}
.value{font-family:var(--head);font-size:34px;font-weight:800;letter-spacing:-1px;color:var(--forest);margin:2px 0 4px;line-height:1.1}
.unit{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:0}

/* Charts */
.charts{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:16px;margin-bottom:16px}
.chart-card{padding:18px}
.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.chart-card h3{margin:0;font-family:var(--head);font-size:15px;font-weight:700;color:var(--forest)}
.chart-unit{font-size:12px;color:var(--emerald);background:var(--mint);padding:4px 9px;border-radius:7px;font-weight:700}
.chart-wrap{height:270px;position:relative}

/* Download */
.download-panel{margin:26px 0 8px;padding:22px}
.download-title{font-family:var(--head);font-weight:700;font-size:17px;color:var(--forest)}
.download-desc{font-size:13px;color:var(--muted);margin:4px 0 16px}
.period{display:flex;flex-wrap:wrap;align-items:end;gap:14px 18px;padding:14px 16px;background:var(--sage);border-radius:11px;margin-bottom:16px}
.period-presets{display:flex;gap:7px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select{font-family:var(--body);font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.period-info{font-size:12px;color:var(--muted);align-self:center;margin-left:auto}
.download-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.download-btn{border:1px solid var(--line);background:#fff;color:var(--forest);padding:12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;transition:.15s}
.download-btn:hover{border-color:var(--leaf);background:var(--mint)}
.download-btn.all{background:linear-gradient(135deg,var(--forest),var(--emerald));color:#fff;border-color:transparent}
.download-btn.all:hover{filter:brightness(1.12)}
.download-btn:disabled{opacity:.6;cursor:not-allowed}
.download-btn.cancel{background:#fff;color:#c62828;border-color:#ef9a9a}
.download-btn.cancel:hover{background:#fdecea;border-color:#e57373}
.preview{margin:0 0 16px}
.pv-btn{font-weight:700}
.pv-title{font-family:var(--head);font-weight:700;font-size:15px;color:var(--forest);margin-bottom:8px}
.pv-note{font-size:12px;color:var(--muted);margin:10px 0 8px}
.pv-wrap{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.pv-table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
.pv-table th{position:sticky;top:0;background:var(--mint);color:var(--forest);text-align:left;padding:8px 12px;font-weight:700;border-bottom:1px solid var(--line)}
.pv-table td{padding:7px 12px;border-bottom:1px solid var(--line)}
.pv-table tbody tr:nth-child(even){background:rgba(0,0,0,.02)}
.pv-empty{font-size:13px;color:var(--muted);padding:12px 0}
/* Profil greenhouse */
.profile{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:26px;overflow:hidden}
.pf-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:22px 24px 0}
.pf-head .section-title{font-size:22px}
.pf-badge{display:inline-flex;align-items:center;gap:7px;background:var(--mint);color:var(--emerald);font-family:var(--head);font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px}
.pf-gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0}
.pf-photo{position:relative;margin:0;padding:0;border:0;border-radius:13px;overflow:hidden;background:#dfe9e2;aspect-ratio:16/10;cursor:zoom-in;display:block;width:100%}
.pf-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.pf-photo:hover img{transform:scale(1.05)}
.pf-photo figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(to top,rgba(5,30,20,.86),rgba(5,30,20,0));color:#fff;font-family:var(--head);font-size:12px;font-weight:600;line-height:1.35;text-align:left}
.pf-desc{margin:14px 0 0;padding:0 24px;font-size:15px;line-height:1.65;color:#2f463a}
.pf-body{padding:18px 24px 24px}
.pf-split{display:grid;grid-template-columns:minmax(250px,1fr) 1.5fr;gap:16px;align-items:stretch}
.pf-info{display:flex;flex-direction:column;gap:12px}
.pf-map{border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;min-height:300px;background:var(--sage)}
.pf-map iframe{flex:1;border:0;width:100%;min-height:260px;display:block}
.pf-map-foot{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;padding:9px 14px;font-size:12.5px;color:var(--muted);background:#fff;border-top:1px solid var(--line)}
.pf-map-foot a{color:var(--emerald);font-weight:600;text-decoration:none}
.pf-map-foot a:hover{text-decoration:underline}
.pf-group{margin-top:20px}
.pf-group-title{font-family:var(--head);font-weight:700;font-size:13px;color:var(--emerald);letter-spacing:.3px;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.pf-group-title::after{content:"";flex:1;height:1px;background:var(--line)}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.pf-item{display:flex;align-items:flex-start;gap:12px;background:var(--sage);border-radius:12px;padding:13px 15px;border:1px solid transparent;transition:border-color .15s}
.pf-item:hover{border-color:var(--line)}
.pf-ico{flex:none;width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:18px;border:1px solid var(--line)}
.pf-label{font-size:12px;color:var(--muted);font-weight:600}
.pf-val{font-family:var(--head);font-weight:700;color:var(--forest);margin-top:2px;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.pf-val.empty{font-family:var(--body);font-weight:500;font-style:italic;color:#8a9d90;font-size:14px}
.pf-sensor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.pf-sensor-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.pf-sensor-card h4{margin:0 0 4px;font-family:var(--head);font-size:14px;font-weight:700;color:var(--forest)}
.pf-sensor-card p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.pf-chips{display:flex;flex-wrap:wrap;gap:7px}
.pf-chip{display:inline-flex;align-items:center;gap:6px;background:var(--mint);color:var(--forest);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;border-left:3px solid var(--cc,var(--leaf))}
.pf-chip.pending{background:#f3f4f3;color:#7a8b80}
.lightbox{border:0;padding:0;background:transparent;max-width:min(94vw,1100px);width:100%;overflow:visible}
.lightbox::backdrop{background:rgba(4,22,15,.82)}
.lb-inner{position:relative;display:flex;flex-direction:column;gap:10px;align-items:center}
.lb-inner img{max-width:100%;max-height:78vh;border-radius:12px;display:block;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.lb-cap{color:#fff;font-family:var(--head);font-weight:600;font-size:14px;text-align:center}
.lb-btn{position:absolute;border:0;background:rgba(255,255,255,.95);color:var(--forest);width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.lb-btn:hover{background:#fff;transform:scale(1.06)}
.lb-close{top:-14px;right:-6px}
.lb-prev{left:-6px;top:38%}
.lb-next{right:-6px;top:38%}


/* Status per alat */
.conn-group{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:560px}
.conn-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);padding:7px 13px;border-radius:999px;white-space:nowrap;font-family:var(--head);font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.2)}
.conn-pill .dot{width:9px;height:9px}
.conn-pill small{font-weight:600;opacity:.8;font-size:11px}
.dot.pending{background:#aab6ae;box-shadow:0 0 0 4px rgba(170,182,174,.2)}
.card-status{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:12px;font-weight:600;color:var(--muted)}
.card-status .dot{width:8px;height:8px;box-shadow:none}
.card-status.online{color:#17734d}.card-status.offline{color:#c0392b}
.pf-chip{cursor:pointer;border:0;border-left:3px solid var(--cc,var(--leaf));font-family:inherit;transition:transform .12s,box-shadow .12s}
.pf-chip:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(11,59,42,.18)}
.pf-chip.pending{cursor:pointer}
.card.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px rgba(23,115,77,.35)}100%{box-shadow:none}}
/* Pin peta */
.gh-pin{width:30px;height:30px;border-radius:50% 50% 50% 0;background:#e53935;border:3px solid #fff;transform:rotate(-45deg);box-shadow:0 3px 8px rgba(0,0,0,.45)}
.gh-pin::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff}
.map-wrap{position:relative;flex:1;display:flex;min-height:260px}.map-wrap iframe{flex:1;border:0;width:100%;min-height:260px;display:block}.gh-pin-wrap{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}.gh-pin-wrap .gh-pin{position:absolute;left:-15px;top:-36px;transform-origin:50% 50%}
/* NPK */
.npk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.npk-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 19px;border-left:5px solid var(--cc)}
@media(max-width:950px){.npk-grid{grid-template-columns:1fr}.conn-group{justify-content:flex-start}}
/* Kalender tanam & GDD hama */
.kt-nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.kt-split{display:grid;grid-template-columns:minmax(250px,1fr) 2.2fr;gap:16px;align-items:start}
.kt-form{display:flex;flex-direction:column;gap:12px}
.kt-form .field input,.kt-form .field select{width:100%}
.kt-stack,#kt-kal-body{display:flex;flex-direction:column;gap:16px}
.kt-scroll{overflow-x:auto;padding-bottom:4px}
.kt-heat{border-collapse:separate;border-spacing:2px;min-width:930px;width:100%;font-size:10.5px}
.kt-heat td{min-width:22px;height:28px;text-align:center;border-radius:4px;font-weight:600}
.kt-heat th{font-weight:600;color:var(--muted)}
.kt-rh{text-align:left;white-space:nowrap;font-size:12px;padding-right:10px;position:sticky;left:0;background:#fff;color:var(--forest);z-index:1}
.kt-rot{writing-mode:vertical-rl;transform:rotate(180deg);height:46px;margin:0 auto;font-size:10.5px;white-space:nowrap}
.kt-legend{display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:12px;color:var(--muted);font-weight:600}
.kt-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.kt-legend .kt-grad{width:140px;height:10px;border-radius:5px;margin:0}
.kt-muted{font-size:12.5px;color:var(--muted);line-height:1.5}
.kt-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:700;font-size:12px;color:#10261c}
.kt-sub-line{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:6px}
.kt-saran p{margin:0 0 10px;font-size:14px;line-height:1.5}
.kt-bars{display:flex;flex-direction:column;gap:9px}
.kt-bar{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.kt-bn{font-weight:600;color:var(--forest)}
.kt-bt{height:14px;background:var(--sage);border-radius:99px;overflow:hidden}
.kt-bt i{display:block;height:100%;border-radius:99px;min-width:2px}
.kt-bar b{text-align:right;font-family:var(--head)}
.kt-note{padding:14px 16px;border-radius:11px;background:var(--mint);color:var(--forest);font-size:14px;line-height:1.5}
.kt-note.warn{background:#fdecea;color:#b3261e}
.kt-progress{height:10px;border-radius:99px;background:#dfe9e2;overflow:hidden;margin-top:14px}
.kt-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--emerald))}
.kt-list{margin:0;padding-left:20px;line-height:1.7;font-size:14px;color:#2f463a}
.kt-list code{background:var(--mint);padding:1px 6px;border-radius:5px;font-size:13px}
#kt-status.ok{color:var(--emerald)}#kt-status.err{color:#c62828}
@media(max-width:950px){.kt-split{grid-template-columns:1fr}}
.footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 15px 36px}
.footer strong{color:var(--forest);font-family:var(--head);font-weight:700}
.toast{position:fixed;right:22px;bottom:22px;background:var(--forest);color:#fff;padding:12px 16px;border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:13px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s;z-index:20;max-width:340px}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:950px){.pf-split{grid-template-columns:1fr}.pf-gallery{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.period-info{margin-left:0}}
@media(max-width:580px){.pf-gallery{grid-template-columns:1fr}.pf-head{padding:20px 16px 0}.pf-desc{padding:0 16px}.pf-body{padding:16px 16px 20px}.lb-prev{left:4px}.lb-next{right:4px}.lb-close{right:4px}.header-content{flex-direction:column;align-items:flex-start}.conn-group{align-self:stretch}.cards{grid-template-columns:1fr}.section-head{flex-direction:column;align-items:flex-start}.value{font-size:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}


.pf-unit-bar{display:flex;justify-content:flex-end;align-items:flex-end;flex-wrap:wrap;gap:10px 16px;margin:0 0 14px}
.pf-unit-bar .range{margin:0}
.pf-unit-meta{font-size:13px;color:var(--muted)}
#panel-env .charts{margin:16px 0 0}

@media(max-width:950px){.pf-unit-bar{align-items:flex-start}}
</style>
</head>
<body>
<header class="header">
 <div class="header-content">
  <div class="brand">
   <div class="brand-logo" id="brandLogo"><span id="logoPlaceholder">Logo</span><img id="logoImg" alt="Logo PT Suryo Riset Indonesia" hidden></div>
   <div class="title"><h1>Greenhouse PT Suryo Riset Indonesia</h1></div>
  </div>
 </div>
</header>
<main class="container">
 <section class="panel" id="panel-profil"></section>
</main>
<footer class="footer">&copy; 2026 <strong>PT Suryo Riset Indonesia</strong>. <a href="mailto:suryoriseti@gmail.com" style="color:var(--emerald);font-weight:600;text-decoration:none">suryoriseti@gmail.com</a></footer>
<dialog class="lightbox" id="lightbox" aria-label="Pratinjau foto">
 <div class="lb-inner">
  <button class="lb-btn lb-close" id="lbClose" aria-label="Tutup">×</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Foto sebelumnya">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-btn lb-next" id="lbNext" aria-label="Foto berikutnya">›</button>
  <div class="lb-cap" id="lbCap"></div>
 </div>

/* ===================== KONFIGURASI ===================== */
const CFG={ env:{id:3518436,key:""},   // field1 = Suhu, field2 = Kelembapan udara, field3 = Intensitas cahaya
 soil:{id:3518510,key:""} };           // field1 = Kelembapan tanah
const REFRESH_MS=15000, OFFLINE_AFTER_MS=5*60*1000;
const PARAMS=[
 {key:"temp", tab:"env", name:"Suhu",             unit:"°C",  badge:"", src:"env", field:"field1", digits:1, color:"#e53935"},
 {key:"rh",   tab:"env", name:"Kelembapan Udara", unit:"%",   badge:"", src:"env", field:"field2", digits:1, color:"#1e88e5"},
 {key:"light",tab:"env", name:"Intensitas Cahaya",unit:"lux", badge:"", src:"env", field:"field3", digits:0, color:"#f9a825"},
 {key:"soil", tab:"env", name:"Kelembapan Tanah", unit:"%",   badge:"", src:"soil",field:"field1", digits:0, color:"#8d6e63"}
];
const TABS={env:{title:"Data Lingkungan",sources:["env","soil"]}};
const DEVICES=[{src:"env",name:"Unit lingkungan"},{src:"soil",name:"Unit tanah"}];

/* ===================== UTILITAS ===================== */
const DATA={},CHARTS={};
let RANGE_MIN=1440,loadOk=false,busy=false;
const $=id=>document.getElementById(id);
// Waktu data dibulatkan ke kelipatan 15 detik (:00, :15, :30, :45) agar kedua channel selaras.
const SLOT_MS=15000,roundT=t=>Math.round(t/SLOT_MS)*SLOT_MS;
function normFeeds(feeds){
 const out=[];
 (feeds||[]).forEach(f=>{
  f.raw_at=f.created_at;f.created_at=new Date(roundT(new Date(f.created_at).getTime())).toISOString();
  const l=out[out.length-1];
  if(l&&l.created_at===f.created_at)out[out.length-1]=f;else out.push(f)
 });
 return out
}
const p2=n=>String(n).padStart(2,"0");
function fmtNum(v,d){const n=Number(v);return Number.isFinite(n)?n.toLocaleString("id-ID",{minimumFractionDigits:d,maximumFractionDigits:d}):"--"}
function fmtTime(s){if(!s)return"--";const d=new Date(s);return`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`}
function fmtShort(s){const d=new Date(s);return`${p2(d.getDate())}/${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`}
function dateStr(d){return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),3000)}
function qs(src,extra){const k=CFG[src].key;return(extra||"")+(k?`${extra?"&":""}api_key=${encodeURIComponent(k)}`:"")}
async function getData(src){
 const r=await fetch(`https://api.thingspeak.com/channels/${CFG[src].id}/feeds.json?minutes=${RANGE_MIN}&results=8000${CFG[src].key?`&api_key=${encodeURIComponent(CFG[src].key)}`:""}`);
 if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();j.feeds=normFeeds(j.feeds);return j
}
async function getSince(src,start){
 const r=await fetch(`https://api.thingspeak.com/channels/${CFG[src].id}/feeds.json?start=${encodeURIComponent(apiTime(start))}&results=8000${CFG[src].key?`&api_key=${encodeURIComponent(CFG[src].key)}`:""}`);
 if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();j.feeds=normFeeds(j.feeds);return j
}
function lastFeed(src){const f=(DATA[src]&&DATA[src].feeds)||[];return f[f.length-1]}


/* ===================== DATA & TAMPILAN ===================== */
function renderCards(){
 PARAMS.forEach(p=>{
  const f=lastFeed(p.src),v=f?Number(f[p.field]):NaN,ok=f&&f[p.field]!=null&&f[p.field]!==""&&Number.isFinite(v);
  $("v-"+p.key).textContent=ok?fmtNum(v,p.digits):"--";
 });
 Object.keys(TABS).forEach(tab=>{
  const t=latestTime(TABS[tab].sources);$("latest-"+tab).textContent=t?`Data terakhir: ${fmtTime(t)}`:"Data terakhir: --"
 });
}
function latestTime(srcs){let m=0;srcs.forEach(s=>{const f=lastFeed(s);if(f&&f.created_at){const t=new Date(f.created_at).getTime();if(t>m)m=t}});return m?new Date(m):null}
// Grafik: sumbu X = waktu (HH:MM:SS) dengan resolusi slot 15 detik. Slot yang kosong => garis diputus (tidak disambung).
// Garis hanya diputus jika celah data jauh lebih besar dari interval kirim normal alat (otomatis: 3x median interval, min 1 menit).
const TICK_STEPS=[15e3,30e3,6e4,3e5,9e5,18e5,36e5,108e5,216e5,432e5,864e5];
function fmtClock(t){const d=new Date(t);return`${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`}
function chartOptions(p){return{responsive:true,maintainAspectRatio:false,parsing:false,spanGaps:false,interaction:{mode:"nearest",axis:"x",intersect:false},plugins:{legend:{display:false},tooltip:{backgroundColor:"#0b3b2a",padding:10,cornerRadius:8,callbacks:{title:items=>items.length?fmtTime(items[0].parsed.x):""}}},scales:{
 x:{type:"linear",grid:{display:false},
  afterBuildTicks:sc=>{const span=sc.max-sc.min,step=TICK_STEPS.find(s=>span/s<=7)||TICK_STEPS[TICK_STEPS.length-1],off=new Date(sc.min).getTimezoneOffset()*6e4,ticks=[];
   for(let t=Math.ceil((sc.min-off)/step)*step+off;t<=sc.max;t+=step)ticks.push({value:t});sc.ticks=ticks},
  ticks:{maxRotation:0,minRotation:0,color:"#5f7568",font:{size:11},callback:function(v){const sp=this.max-this.min,d=new Date(v);return sp>=72e5*10?[`${p2(d.getDate())}/${p2(d.getMonth()+1)}`,fmtClock(v)]:fmtClock(v)}}},
 y:{grid:{color:"#e9f0ea"},ticks:{color:"#5f7568",font:{size:11}}}}}}
function datasets(p,pts){
 const iso=i=>pts[i].y!=null&&(i===0||pts[i-1].y==null)&&(i===pts.length-1||pts[i+1].y==null);
 return[{label:p.name,data:pts,borderColor:p.color,backgroundColor:p.color+"22",pointBackgroundColor:p.color,fill:true,borderWidth:2.2,spanGaps:false,
  pointRadius:c=>iso(c.dataIndex)?2.5:(pts.length>300?0:1.5),pointHoverRadius:4,tension:.28}]
}
// Ubah daftar feed menjadi titik {x:waktu(ms), y:nilai}; sisipkan titik kosong (y:null) di tiap celah agar garis terputus.
function buildPoints(feeds,field,gapMs){
 const pts=[];let prev=null;
 feeds.forEach(f=>{
  const t=new Date(f.created_at).getTime();
  if(prev!==null&&t-prev>gapMs)pts.push({x:prev+SLOT_MS,y:null});
  pts.push({x:t,y:Number(f[field])});prev=t
 });
 return pts
}
function renderCharts(changed){
 PARAMS.forEach(p=>{
  if(p.tab==="npk")return;
  if(changed&&!changed.has(p.src))return;
  const feeds=((DATA[p.src]&&DATA[p.src].feeds)||[]).filter(x=>x[p.field]!=null&&x[p.field]!==""),
   pts=buildPoints(feeds,p.field,offlineLimit(p.src));
  let c=CHARTS[p.key];
  if(!c){const chart=new Chart($("c-"+p.key),{type:"line",data:{datasets:datasets(p,pts)},options:chartOptions(p)});c=CHARTS[p.key]={chart}}
  const sx=c.chart.options.scales.x;
  if(pts.length){sx.min=pts[0].x;sx.max=Math.max(pts[pts.length-1].x,roundT(Date.now()))}else{sx.min=undefined;sx.max=undefined}
  c.chart.data.datasets=datasets(p,pts);c.chart.update("none");
 });
}
// Batas offline menyesuaikan interval kirim alat: 3x selisih waktu data (median), minimal 1 menit, maksimal 60 menit.
function offlineLimit(src){
 const t=((DATA[src]&&DATA[src].feeds)||[]).slice(-12).map(x=>new Date(x.created_at).getTime()),g=[];
 for(let i=1;i<t.length;i++)g.push(t[i]-t[i-1]);
 if(!g.length)return OFFLINE_AFTER_MS;
 g.sort((a,b)=>a-b);return Math.min(3600000,Math.max(60000,g[Math.floor(g.length/2)]*3))
}

// Status data satu parameter: waktu terakhir ada nilai di field tersebut, dibandingkan dengan batas offline alatnya.
function paramStatus(src,field){
 if(!CFG[src].id)return{st:"pending",t:null};
 const feeds=(DATA[src]&&DATA[src].feeds)||[];
 for(let i=feeds.length-1;i>=0;i--){
  const x=feeds[i][field];
  if(x!=null&&x!==""){const t=new Date(feeds[i].created_at).getTime();return{st:Date.now()-t<=offlineLimit(src)?"online":"offline",t}}
 }
 return{st:loadOk?"offline":"pending",t:null}
}
function deviceStatus(src){
 if(!CFG[src].id)return"pending";
 const f=lastFeed(src);
 if(!f)return loadOk?"offline":"pending";
 return Date.now()-new Date(f.created_at).getTime()<=offlineLimit(src)?"online":"offline"
}
const ST_TXT={online:"Online",offline:"Offline",pending:"Memeriksa..."};
function updateConnection(){
 if($("connGroup"))$("connGroup").innerHTML=DEVICES.filter(d=>deviceStatus(d.src)!=="pending").map(d=>{const st=deviceStatus(d.src);return`<div class="conn-pill" title="${d.name}: ${ST_TXT[st]}"><span class="dot ${st}"></span>${d.name}: ${ST_TXT[st]}</div>`}).join("");
 PARAMS.forEach(p=>{
  const el=$("st-"+p.key);if(!el)return;
  const r=paramStatus(p.src,p.field);
  el.className="card-status "+r.st;
  el.innerHTML=`<span class="dot ${r.st}"></span><span>${ST_TXT[r.st]}${r.t&&r.st==="offline"?" · data terakhir "+fmtTime(r.t):""}</span>`
 })
}

// Muat penuh sekali, lalu hanya ambil data baru (incremental) agar ringan tiap 15 detik.
async function fetchLatest(src){
 if(src==="npk"){
  const r=await fetch(`https://api.thingspeak.com/channels/${CFG[src].id}/feeds.json?results=12${CFG[src].key?`&api_key=${encodeURIComponent(CFG[src].key)}`:""}`);
  if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();DATA[src]={feeds:normFeeds(j.feeds)};return true
 }
 const cur=DATA[src],last=lastFeed(src);
 if(!cur||!last){const d=await getData(src);DATA[src]={feeds:d.feeds||[]};return true}
 const nf=(await getSince(src,new Date(new Date(last.raw_at||last.created_at).getTime()+1000))).feeds||[];
 if(!nf.length)return false;
 nf.forEach(f=>{const l=cur.feeds[cur.feeds.length-1];if(l&&l.created_at===f.created_at)cur.feeds[cur.feeds.length-1]=f;else cur.feeds.push(f)});
 const cutoff=Date.now()-RANGE_MIN*60000;
 while(cur.feeds.length&&new Date(cur.feeds[0].created_at).getTime()<cutoff)cur.feeds.shift();
 while(cur.feeds.length>8000)cur.feeds.shift();
 return true
}
async function loadDashboard(){
 if(busy)return;busy=true;
 try{
  const srcs=Object.keys(CFG).filter(k=>CFG[k].id),changed=new Set();

 }finally{busy=false}
}


/* ===================== UNDUH DATA PER PERIODE & INTERVAL ===================== */
const DL_CTRL={};
const RES_LABEL={60:"1menit",600:"10menit",3600:"1jam",86400:"harian"};
const RES_TEXT={60:"per 1 menit",600:"per 10 menit",3600:"per 1 jam",86400:"harian"};
function buildDownload(tab){
 const ps=PARAMS.filter(p=>p.tab===tab),el=$("dl-"+tab);
 el.innerHTML=`<div class="download-title">Unduh Data Pengukuran</div>
 <div class="download-desc">Pilih periode dan interval data, lalu unduh per parameter atau seluruh parameter dalam format CSV. Data diperbarui otomatis setiap 15 detik.</div>
 <div class="period">
  <div class="period-presets">
   <button class="chip" data-preset="today">Hari ini</button><button class="chip active" data-preset="7">7 hari</button><button class="chip" data-preset="30">30 hari</button><button class="chip" data-preset="all">Semua data</button>
  </div>
  <label class="field">Dari tanggal<input type="date" id="from-${tab}"></label>
  <label class="field">Sampai tanggal<input type="date" id="to-${tab}"></label>
  <label class="field">Interval data<select id="res-${tab}">${Object.keys(RES_TEXT).map(k=>`<option value="${k}"${k==="600"?" selected":""}>${RES_TEXT[k][0].toUpperCase()+RES_TEXT[k].slice(1)}</option>`).join("")}</select></label>
  <div class="period-info" id="info-${tab}"></div>
 </div>
 <div class="preview"><div class="pv-title">Tabel</div><button class="chip pv-btn" id="pvbtn-${tab}">Refresh data</button><div id="pv-${tab}"></div></div>
 <div class="download-grid">${ps.map(p=>`<button class="download-btn" id="dl-${tab}-${p.key}">${p.badge} ${p.name}</button>`).join("")}<button class="download-btn all" id="dl-${tab}-all">Unduh semua parameter</button><button class="download-btn cancel" id="cancel-${tab}" hidden>Batalkan unduhan</button></div>`;
 const from=$("from-"+tab),to=$("to-"+tab),res=$("res-"+tab),info=$("info-"+tab);
 const refresh=()=>{info.textContent=`Periode: ${!from.value&&!to.value?"seluruh data":`${from.value||"awal"} s/d ${to.value||"sekarang"}`}. Interval: ${RES_TEXT[res.value]}.`};
 const setPreset=k=>{
  const now=new Date(),s=new Date();
  if(k==="all"){from.value="";to.value=""}
  else{s.setDate(now.getDate()-(k==="today"?0:Number(k)-1));from.value=dateStr(s);to.value=dateStr(now)}
  el.querySelectorAll("[data-preset]").forEach(b=>b.classList.toggle("active",b.dataset.preset===k));refresh()
 };
 el.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{setPreset(b.dataset.preset);autoPv()});
 [from,to].forEach(i=>i.onchange=()=>{el.querySelectorAll("[data-preset]").forEach(b=>b.classList.remove("active"));refresh();setTimeout(autoPv)});
 const autoPv=()=>{if(!$("panel-"+tab).hidden)runPreview(tab,ps,$(`pvbtn-${tab}`))};
 res.onchange=()=>{refresh();autoPv()};
 setPreset("7");
 ps.forEach(p=>$(`dl-${tab}-${p.key}`).onclick=()=>runDownload(tab,[p],$(`dl-${tab}-${p.key}`)));
 $(`dl-${tab}-all`).onclick=()=>runDownload(tab,ps,$(`dl-${tab}-all`));
 el.dataset.pv="0";window.PV_LOAD=window.PV_LOAD||{};PV_LOAD[tab]=()=>{if(el.dataset.pv==="0"){el.dataset.pv="1";runPreview(tab,ps,$(`pvbtn-${tab}`))}};
 $(`pvbtn-${tab}`).onclick=()=>runPreview(tab,ps,$(`pvbtn-${tab}`));
 $(`cancel-${tab}`).onclick=()=>{if(DL_CTRL[tab])DL_CTRL[tab].abort()};
}
function getPeriod(tab){
 const f=$("from-"+tab).value,t=$("to-"+tab).value;
 const from=f?new Date(f+"T00:00:00"):null,to=t?new Date(t+"T23:59:59"):null;
 if(from&&to&&from>to){toast("Tanggal awal tidak boleh lebih besar dari tanggal akhir.");return null}
 return{from,to,label:`${f||"awal"}_sd_${t||"sekarang"}`}
}
const apiTime=d=>d.toISOString().slice(0,19).replace("T"," ");
function fmtClock(t){const d=new Date(t);return`${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`}
function fmtDate(t){const d=new Date(t);return`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`}
// Kelompokkan waktu ke awal interval (berdasarkan waktu lokal). size dalam detik; 0 = data asli.
function bucketKey(t,size){
 if(!size)return t;
 const d=new Date(t),mid=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(),sz=size*1000;
 return mid+Math.floor((t-mid)/sz)*sz
}
async function fetchWindow(src,a,b,signal){
 const url=`https://api.thingspeak.com/channels/${CFG[src].id}/feeds.json?results=8000&start=${encodeURIComponent(apiTime(a))}&end=${encodeURIComponent(apiTime(b))}${CFG[src].key?`&api_key=${encodeURIComponent(CFG[src].key)}`:""}`;
 const r=await fetch(url,{signal});if(!r.ok)throw new Error("HTTP "+r.status);
 const feeds=(await r.json()).feeds||[];
 if(feeds.length>=8000&&b-a>10000){const m=new Date((a.getTime()+b.getTime())/2);return(await fetchWindow(src,a,m,signal)).concat(await fetchWindow(src,new Date(m.getTime()+1000),b,signal))}
 return feeds
}
// Ambil data per jendela 2 hari; onFeeds dipanggil tiap jendela agar tidak menumpuk di memori.
async function fetchSource(src,from,to,onFeeds,onProgress,signal){
 if(!CFG[src].id)return;
 let a=from;
 if(!a){const r=await fetch(`https://api.thingspeak.com/channels/${CFG[src].id}.json${CFG[src].key?`?api_key=${encodeURIComponent(CFG[src].key)}`:""}`,{signal});if(!r.ok)throw new Error("HTTP "+r.status);a=new Date((await r.json()).created_at)}
 const b=to||new Date(),span=Math.max(b-a,1);
 for(let s=new Date(a);s<=b;){
  const e=new Date(Math.min(s.getTime()+2*864e5,b.getTime()));
  if(signal&&signal.aborted)throw new DOMException("Dibatalkan","AbortError");
  onFeeds(await fetchWindow(src,s,e,signal));
  onProgress&&onProgress(Math.min((e-a)/span,1));
  s=new Date(e.getTime()+1000)
 }
}
function csvEscape(v){return`"${String(v??"").replace(/"/g,'""')}"`}
function saveCSV(headers,rows,filename){
 const csv="\uFEFF"+[headers,...rows].map(r=>r.map(csvEscape).join(";")).join("\r\n");
 const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"})),a=document.createElement("a");
 a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)
}
// Ambil & agregasi data sesuai periode + interval; dipakai oleh pratinjau tabel dan unduhan CSV.
async function collectRows(tab,ps,size,from,to,onProgress,signal){
 const acc=new Map(),srcs=[...new Set(ps.map(p=>p.src))];
 for(let si=0;si<srcs.length;si++){
  const src=srcs[si],seen=new Set(),sp=ps.map((p,i)=>[p,i]).filter(([p])=>p.src===src);
  await fetchSource(src,from,to,feeds=>feeds.forEach(f=>{
   if(seen.has(f.entry_id))return;seen.add(f.entry_id);
   const key=bucketKey(roundT(new Date(f.created_at).getTime()),size);
   sp.forEach(([p,i])=>{
    const raw=f[p.field];if(raw==null||raw==="")return;
    const v=Number(raw);if(!Number.isFinite(v))return;
    let row=acc.get(key);if(!row){row=ps.map(()=>({s:0,n:0}));acc.set(key,row)}
    if(size){row[i].s+=v;row[i].n++}else{row[i].s=v;row[i].n=1}
   })
  }),fr=>{onProgress&&onProgress((si+fr)/srcs.length)},signal)
 }
 if(signal&&signal.aborted)throw new DOMException("Dibatalkan","AbortError");
 let ent=[...acc.entries()].sort((a,b)=>a[0]-b[0]);
 // Gabungkan baris yang berdekatan (slot 15 detik bersebelahan) bila kolomnya tidak bentrok, supaya data tiap channel satu baris.
 if(!size&&ps.length>1){const m=[];ent.forEach(([k,row])=>{const l=m[m.length-1];if(l&&k-l[0]<=SLOT_MS&&row.every((c,i)=>!(c.n&&l[1][i].n))){row.forEach((c,i)=>{if(c.n)l[1][i]=c})}else m.push([k,row])});ent=m}
 // Per 1 menit: tampilkan semua menit tanpa loncat; menit tanpa data dibiarkan kosong.
 if(size===60&&ent.length){const mp=new Map(ent),fill=[];for(let t=ent[0][0];t<=ent[ent.length-1][0];t+=60000)fill.push([t,mp.get(t)||ps.map(()=>({s:0,n:0}))]);ent=fill}
 const daily=size===86400;
 const rows=ent.map(([k,row])=>[...(daily?[fmtDate(k)]:[fmtDate(k),fmtClock(k)]),...row.map((c,i)=>c.n?(size?Number((c.s/c.n).toFixed(ps[i].digits+2)):c.s/c.n):"")]);
 const headers=[...(daily?["Tanggal"]:["Tanggal","Jam"]),...ps.map(p=>`${p.name} (${p.unit})`)];
 return{headers,rows}
}
const PREVIEW_ROWS=50;
async function runPreview(tab,ps,btn){
 const per=getPeriod(tab);if(!per)return;
 if(ps.every(p=>!CFG[p.src].id)){toast("Channel untuk parameter ini belum dikonfigurasi.");return}
 const size=Number($("res-"+tab).value),box=$("pv-"+tab),old=btn.textContent,ctrl=new AbortController();
 // Pratinjau hanya mengambil 2 hari terakhir dari periode terpilih agar cepat.
 const end=per.to||new Date(),lim=new Date(end.getTime()-2*864e5),from=per.from&&per.from>lim?per.from:lim;
 btn.disabled=true;btn.textContent="Memuat tabel...";
 try{
  const {headers,rows}=await collectRows(tab,ps,size,from,end,null,ctrl.signal);
  if(!rows.length){box.innerHTML='<div class="pv-empty">Tidak ada data pada periode yang dipilih.</div>';return}
  const shown=rows.slice(-PREVIEW_ROWS).reverse(),fmt=v=>v===""?"–":typeof v==="number"?v.toLocaleString("id-ID",{maximumFractionDigits:4}):v;
  box.innerHTML=`<div class="pv-note">Menampilkan ${shown.length.toLocaleString("id-ID")} baris terbaru dari data 2 hari terakhir pada periode terpilih (interval ${RES_TEXT[size]}). File unduhan memuat seluruh periode.</div>
  <div class="pv-wrap"><table class="pv-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${shown.map(r=>`<tr>${r.map(v=>`<td>${fmt(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`
 }catch(e){console.error(e);box.innerHTML='<div class="pv-empty">Gagal memuat tabel. Coba lagi.</div>'}
 finally{btn.disabled=false;btn.textContent=old}
}
async function runDownload(tab,ps,btn){
 const per=getPeriod(tab);if(!per)return;
 if(ps.every(p=>!CFG[p.src].id)){toast("Channel untuk parameter ini belum dikonfigurasi.");return}
 const size=Number($("res-"+tab).value),btns=[...$("dl-"+tab).querySelectorAll(".download-btn:not(.cancel)")],old=btn.textContent,cancelBtn=$("cancel-"+tab),ctrl=new AbortController();
 DL_CTRL[tab]=ctrl;cancelBtn.hidden=false;
 btns.forEach(b=>b.disabled=true);btn.textContent="Mengambil data...";
 try{
  const {headers,rows}=await collectRows(tab,ps,size,per.from,per.to,fr=>{btn.textContent=`Mengambil data... ${Math.round(fr*100)}%`},ctrl.signal);
  if(!rows.length){toast("Tidak ada data pada periode yang dipilih.");return}
  const name=ps.length===1?ps[0].key:(tab==="npk"?"npk":tab==="gas"?"emisi":"lingkungan");
  saveCSV(headers,rows,`suryo_${name}_${RES_LABEL[size]}_${per.label}.csv`);
  toast(`Data ${RES_TEXT[size]} berhasil diunduh (${rows.length.toLocaleString("id-ID")} baris).`)
 }catch(e){
  if(e&&e.name==="AbortError")toast("Unduhan dibatalkan.");
  else{console.error(e);toast("Gagal mengambil data dari server. Coba lagi.")}
 }
 finally{cancelBtn.hidden=true;DL_CTRL[tab]=null;btns.forEach(b=>b.disabled=false);btn.textContent=old}
}

 <div class="profile" style="margin-top:22px">

 <div class="pf-body" id="panel-env">
   <div class="pf-unit-bar">
    <div class="range" id="rangeBar"><span>Rentang grafik</span>
     <button class="chip" data-minutes="240">4 jam</button><button class="chip active" data-minutes="1440">1 hari</button><button class="chip" data-minutes="4320">3 hari</button><button class="chip" data-minutes="10080">7 hari</button>
    </div>
   </div>
   <div class="cards" style="--cols:4">${PARAMS.map(cardHTML).join("")}</div>
